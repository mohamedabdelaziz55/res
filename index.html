<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مطعم المصري B.B.Q | دهب</title>
<meta name="description" content="منيو مطعم المصري للمشويات في دهب — اطلب دليفري، استلام، أو من على الطاولة مباشرة على الواتساب.">
<meta name="theme-color" content="#a82a24">
<meta property="og:title" content="مطعم المصري B.B.Q — دهب">
<meta property="og:description" content="مشويات على الفحم • اطلب على الواتساب في ثواني">
<meta property="og:image" content="assets/logo-wide.png">
<link rel="icon" href="assets/icon.png"><link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Top bar -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="#top" aria-label="El Masry">
      <span class="brand-logo"><img src="assets/logo-wide.png" alt=""></span>
    </a>
    <div class="top-actions">
      <span class="status" id="status"></span>
      <button class="icon-btn" id="langBtn" aria-label="Language">EN</button>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="hero" id="top">
  <div class="embers" aria-hidden="true"></div>
  <div class="wrap hero-in">
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="heroTitle"></h1>
    <p class="hero-sub" data-t="heroSub"></p>

    <div class="table-banner" id="tableBanner" hidden></div>

    <div class="modes" id="modes" role="tablist">
      <button class="mode" data-mode="delivery" role="tab"><span>🛵</span><b data-t="delivery"></b><small data-t="deliverySub"></small></button>
      <button class="mode" data-mode="pickup" role="tab"><span>🛍️</span><b data-t="pickup"></b><small data-t="pickupSub"></small></button>
      <button class="mode" data-mode="dinein" role="tab"><span>🍽️</span><b data-t="dinein"></b><small data-t="dineinSub"></small></button>
    </div>
  </div>
</section>

<!-- Search + categories (sticky) -->
<nav class="catbar" id="catbar">
  <div class="wrap">
    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
      <input id="search" type="search" autocomplete="off">
    </label>
    <div class="chips" id="chips"></div>
  </div>
</nav>

<main class="wrap" id="menu">
  <section id="bestWrap">
    <h2 class="sec-title"><span>⭐</span> <span data-t="best"></span></h2>
    <div class="best-row" id="best"></div>
  </section>
  <div id="sections"></div>
  <p class="empty" id="noResults" hidden data-t="noResults"></p>
</main>

<footer class="footer">
  <div class="wrap">
    <img class="foot-logo" src="assets/logo-wide.png" alt="">
    <p data-t="footerAbout"></p>
    <div class="foot-links">
      <a id="mapsLink" target="_blank" rel="noopener">📍 <span data-t="location"></span></a>
      <a id="callLink">📞 <span id="phoneText"></span></a>
      <a id="waLink" target="_blank" rel="noopener">💬 WhatsApp</a>
    </div>
    <small>© <span id="year"></span> El Masry B.B.Q — Dahab</small>
  </div>
</footer>

<!-- Floating cart button -->
<button class="cart-fab" id="cartFab" hidden>
  <span class="fab-count" id="fabCount">0</span>
  <span data-t="viewCart"></span>
  <b id="fabTotal"></b>
</button>

<!-- Product sheet -->
<div class="overlay" id="overlay"></div>
<aside class="sheet" id="productSheet" aria-modal="true" role="dialog"></aside>

<!-- Cart drawer -->
<aside class="sheet cart" id="cartSheet" aria-modal="true" role="dialog"></aside>

<div class="toast" id="toast"></div>

<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
